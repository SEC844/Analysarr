version: 2

# Une seule PR groupée par écosystème, vers dev (jamais main directement),
# pour les mises à jour mineures et correctifs uniquement. Les versions
# majeures (et les changements de version de Python, qui cassent souvent les
# dépendances compilées) demandent une migration testée : elles sont faites
# à la main, pas proposées automatiquement. L'audit de sécurité des
# dépendances reste vérifié à chaque build par la CI.
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      backend:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # sqlmodel 0.0.45 impose des dates avec fuseau et refuse les dates
      # naïves que le projet enregistre en UTC (rupture annoncée malgré un
      # simple numéro de correctif) : migration à faire à la main, avec les
      # bases existantes, jamais par une mise à jour automatique.
      - dependency-name: sqlmodel
        versions: [">=0.0.45"]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
