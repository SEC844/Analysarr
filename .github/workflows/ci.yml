name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check & build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pip-audit

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy

      - name: Tests
        # Aucun service réel : Emby/Jellyfin, *arr, qBittorrent, Seer et GitHub
        # sont simulés (voir tests/conftest.py).
        run: pytest

      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  release-notes:
    # Aperçu des notes de la prochaine version (mêmes réglages que la
    # publication, .github/cliff.toml) dans le résumé du job : une erreur de
    # configuration se voit ici, pas le jour du tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tout l'historique et les tags : le changelog part de la dernière version

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .github/cliff.toml
          args: --unreleased
        env:
          OUTPUT: git-cliff/changelog.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Preview
        run: cat git-cliff/changelog.md >> "$GITHUB_STEP_SUMMARY"
