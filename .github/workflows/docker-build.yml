name: Docker build & push

on:
  push:
    tags:
      - "v*.*.*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN se voit refuser la création d'un tout nouveau package GHCR
          # sur un compte personnel (permission_denied: write_package), même avec
          # `permissions: packages: write` et le repo réglé sur "Read and write
          # permissions". CR_PAT est un token personnel (scope write:packages) qui
          # contourne cette limitation pour le premier push.
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # nécessaire pour lire le message du tag annoté ci-dessous

      - name: Extract tag message
        id: tag_message
        # Le corps du tag annoté (créé avec `git tag -a`) sert directement de
        # notes de version — déjà rédigé à la main pour chaque release, pas
        # besoin de le regénérer depuis les commits.
        run: |
          {
            echo 'body<<GITHUB_RELEASE_BODY_EOF'
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            echo GITHUB_RELEASE_BODY_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.tag_message.outputs.body }}
