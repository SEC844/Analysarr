services:
  analysarr:
    image: ghcr.io/sec844/analysarr:latest
    # Pour construire l'image localement à la place : remplacez la ligne
    # ci-dessus par "build: ."
    container_name: analysarr
    restart: unless-stopped
    ports:
      - "1818:1818"
    environment:
      # Seules variables à connaître : tout le reste (serveur multimédia,
      # Sonarr, Radarr, qBittorrent, Seer, cross-seed...) se configure depuis
      # l'assistant au premier lancement (aucun .env requis).
      PORT: 1818
      # Utilisateur et groupe sous lesquels tourne Analysarr : mettez les
      # mêmes que Sonarr, Radarr et votre client torrent (Unraid : 99/100).
      # Seul /config change de propriétaire au démarrage, jamais /data.
      PUID: 1000
      PGID: 1000
      UMASK: "002"
      # Base SQLite (réglages + cache de scan), rangée hors des médias.
      # Une base encore dans /data (ancien exemple) est reprise telle quelle
      # si cette variable est absente ; sinon gardez
      # DATABASE_PATH=/data/analysarr.db pour conserver votre configuration.
      DATABASE_PATH: /config/analysarr.db
    volumes:
      - ./analysarr:/config

      # Montez vos données avec le MÊME chemin hôte ET le MÊME chemin
      # conteneur que dans votre serveur multimédia, qBittorrent, Sonarr et
      # Radarr, sinon les hardlinks ne peuvent pas être détectés
      # (organisation TRaSH Guides : /mnt/data monté sur /data partout).
      - /mnt/data:/data
